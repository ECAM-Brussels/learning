services:
  postgres:
    image: postgres:latest
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./db-data/:/var/lib/postgresql
  seed:
    build:
      context: .
      dockerfile: apps/test/Dockerfile
      target: dev
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ['bun', 'run', '--filter', '@learning/db', 'db:push']
    restart: 'no'
  symapi:
    build:
      context: apps/symapi
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
  learning-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: apps/test/Dockerfile
      target: dev
    env_file:
      - .env
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    restart: unless-stopped
  learning:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/test/Dockerfile
      target: prod
    env_file:
      - .env
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    restart: unless-stopped
