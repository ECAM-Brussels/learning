name: Lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 'Set up Python'
        uses: actions/setup-python@v6
        with:
          python-version-file: './apps/symapi/.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Lint
        run: bun lint:check
