[project]
name = "symapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "antlr4-python3-runtime==4.11",
    "fastapi[standard]>=0.128.0",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "watchfiles>=1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
