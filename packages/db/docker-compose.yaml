services:
  postgres:
    image: postgres:latest
    ports:
      - 5432:5432
    env_file:
      - ../../.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./db-data/:/var/lib/postgresql
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
  seed:
    build:
      context: ../..
      dockerfile: packages/db/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    command: ['bun', 'run', '--filter', '@learning/db', 'db:push']
    restart: 'no'
